# ==============================================================================
#
# This file shows how to run iperf3 clients and automatically
# capture their output in a format compatible with the experiment results.
#
# ==============================================================================

- name: Run iperf3 clients with automatic output capture
  hosts: "{{ target_devices | default('all') }}"
  gather_facts: no
  become: yes
  tasks:
    # Create the results directory (REQUIRED /tmp/iperf3_results)
    - name: Create results directory
      file:
        path: /tmp/iperf3_results
        state: directory
        mode: '0755'

    # Run iperf3 for each flow with output capture (REQUIRED file format /tmp/iperf3_results/iperf_flow_...txt)
    - name: Start iperf3 client h4 to sw4 data link
      when: inventory_hostname == 'h4'
      shell: |
        TARGET_IP="10.0.0.0"
        TARGET_PORT="5201"
        DURATION=240
        result_file="/tmp/iperf3_results/iperf_flow_1_{{ inventory_hostname }}.txt"

        if [ ! -f "$result_file" ]; then
          echo "=========================================================================" > "$result_file"
          echo "Flow 1: {{ inventory_hostname }} -> ${TARGET_IP}:${TARGET_PORT}" >> "$result_file"
          echo "=========================================================================" >> "$result_file"
        fi

        echo "" >> "$result_file"
        echo "--- Execution at $(date '+%Y-%m-%d %H:%M:%S') ---" >> "$result_file"

        iperf3 -c $TARGET_IP -p $TARGET_PORT -t $DURATION -b 50M -i 10 >> "$result_file" 2>&1

        echo "Completed flow 1"
      args:
        executable: /bin/bash
      async: 270
      poll: 0

# ==============================================================================
# REQUIREMENTS:
# ==============================================================================
#
# Files MUST be saved in: /tmp/iperf3_results/
# Files MUST follow pattern: iperf_flow_<FLOW_ID>_<HOSTNAME>.txt
#
# Example valid filenames:
#   - iperf_flow_h1_to_h2_h1.txt
#   - iperf_flow_client1_h3.txt
#   - iperf_flow_1_sw1.txt
#
# It is IMPORTANT to run the iperf client using the following mode:
#
#      async: <FLOW_DURATION> + OFFSET
#      poll: 0
#
# With async, a task is created and executed on the target device for the specified duration in seconds,
# the duration must be at least the duration of the iperf flow, add also a small offset,
# to allow the complete output collection
#
# The value of poll must be 0, so the playbook can terminate without wait the async task execution
# ==============================================================================