---
- name: Start iperf3 client on target hosts
  hosts: "{{ target_devices | join(',') }}"
  gather_facts: no
  become: yes
  tasks:
    - name: Check if iperf3 is installed
      command: which iperf3
      register: iperf3_check
      ignore_errors: yes
      changed_when: false

    - name: Fail if iperf3 is not installed
      fail:
        msg: "iperf3 is not installed on {{ inventory_hostname }}"
      when: iperf3_check.rc != 0

    - name: Create results directory
      file:
        path: /tmp/iperf3_results
        state: directory
        mode: '0755'

    - name: Get client config for this host
      set_fact:
        flows: "{{ clients_config[inventory_hostname] }}"

    - name: Start iperf3 client for each flow
      shell: |
        result_file="/tmp/iperf3_results/iperf_flow_{{ item.flow_id }}_{{ inventory_hostname }}.txt"
        
        if [ ! -f "$result_file" ]; then
          echo "=========================================================================" > $result_file
          echo "Flow {{ item.flow_id }}: {{ inventory_hostname }} -> {{ item.server_ip }}:{{ item.port }}" >> $result_file
          echo "=========================================================================" >> $result_file
        fi
        
        echo "" >> $result_file
        echo "--- Execution at $(date '+%Y-%m-%d %H:%M:%S') ---" >> $result_file
        
        iperf_cmd="iperf3 -c {{ item.server_ip }} -p {{ item.port }} -t {{ item.duration }}"
        
        {% if item.bandwidth_mbps != 'unlimited' and item.bandwidth_mbps != '' %}
        iperf_cmd="$iperf_cmd -b {{ item.bandwidth_mbps }}M"
        {% endif %}
        {% if item.protocol == 'udp' %}
        iperf_cmd="$iperf_cmd -u"
        {% endif %}
        
        eval "$iperf_cmd >> $result_file 2>&1"
        echo "Completed flow {{ item.flow_id }}"
      args:
        executable: /bin/bash
      async: "{{ (item.duration | int) + 10 }}"
      poll: 0
      loop: "{{ flows }}"
      loop_control:
        label: "Flow {{ item.flow_id }}"
      register: client_jobs

    - name: Log client start
      debug:
        msg: "Started {{ flows | length }} flow(s) from {{ inventory_hostname }}"