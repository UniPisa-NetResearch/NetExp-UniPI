        - "bash -c '/usr/sbin/sshd -D &'"
    
    sw5:
      kind: sonic-vs
      image: docker-sonic-vs:latest
      mgmt-ipv4: 172.20.20.155
      exec:
        - "service ssh start"
        - "useradd -m admin"
        - "bash -c 'echo admin:YourPaSsWoRd | chpasswd'"
        - "bash -c 'apt-get update && apt-get install -y sudo'"
        - "usermod -aG sudo admin"
        - "bash -c 'echo \"admin ALL=(ALL) NOPASSWD: ALL\" > /etc/sudoers.d/admin'"
        - "chmod 440 /etc/sudoers.d/admin"
        - "bash -c \"sed -i 's/bgpd=no/bgpd=yes/' /etc/frr/daemons && sed -i 's/ospfd=no/ospfd=yes/' /etc/frr/daemons && service frr restart && sleep 5\""
        - "bash -c 'vtysh -c \"write memory\" || true'"
    
