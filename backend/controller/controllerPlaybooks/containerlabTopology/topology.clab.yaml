name: virtualTopology

topology:
  nodes:
    h1:
      kind: linux
      image: ubuntu:22.04
      mgmt-ipv4: 172.20.20.161
      exec:
        - "bash -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server sudo iputils-ping iproute2'"
        - "useradd -m -s /bin/bash oem"
        - "bash -c 'echo oem:oem123 | chpasswd'"
        - "bash -c 'echo \"oem ALL=(ALL) NOPASSWD: ALL\" >> /etc/sudoers'"
        - "mkdir -p /run/sshd"
        - "bash -c '/usr/sbin/sshd -D &'"
    
    h2:
      kind: linux
      image: ubuntu:22.04
