---
- name: Manage Containerlab topology
  hosts: localhost
  gather_facts: no
  vars:
    topo_dir: "{{ lookup('env', 'HOME') }}/res_{{ reservation_id }}_topology"

  tasks:

    # --- DEPLOY --------------------------------------------------------------
    - name: Create topology directory
      ansible.builtin.file:
        path: "{{ topo_dir }}"
        state: directory
        mode: '0755'
      when: action == 'deploy'

    - name: Copy topology.clab.yaml into topology directory
      ansible.builtin.copy:
        src: "{{ topology_src }}"   # passed as extra-var from controller
        dest: "{{ topo_dir }}/topology.clab.yaml"
      when: action == 'deploy'

    - name: Deploy Containerlab topology
      ansible.builtin.command:
        cmd: containerlab deploy --reconfigure
        chdir: "{{ topo_dir }}"
      when: action == 'deploy'

    - name: Write FRR memory on each sonic-vs device
      ansible.builtin.command:
        cmd: docker exec {{ item }} vtysh -c "write memory"
      loop: "{{ sonic_vs_containers | default([]) }}"
      when: action == 'deploy'
      ignore_errors: yes

    - name: Enable bgpd in FRR daemons config
      ansible.builtin.command:
        cmd: >
          docker exec {{ item }}
          sudo sed -i 's/bgpd=no/bgpd=yes/' /etc/frr/daemons
      loop: "{{ sonic_vs_containers | default([]) }}"
      when: action == 'deploy'
      ignore_errors: yes

    - name: Restart FRR service
      ansible.builtin.command:
        cmd: docker exec {{ item }} service frr restart
      loop: "{{ sonic_vs_containers | default([]) }}"
      when: action == 'deploy'
      ignore_errors: yes

    - name: Check FRR service status
      ansible.builtin.command:
        cmd: docker exec {{ item }} service frr status
      loop: "{{ sonic_vs_containers | default([]) }}"
      register: frr_status
      when: action == 'deploy'

    - name: Print FRR status output
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ frr_status.results | default([]) }}"
      when: action == 'deploy'

    # --- DESTROY -----------------------------------------------------------
    - name: Destroy Containerlab topology
      ansible.builtin.command:
        cmd: containerlab destroy
        chdir: "{{ topo_dir }}"
      when: action == 'destroy'

    - name: Remove topology directory
      ansible.builtin.file:
        path: "{{ topo_dir }}"
        state: absent
      when: action == 'destroy'