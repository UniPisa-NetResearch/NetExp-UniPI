- name: Fetch SONiC config_db.json and FRR from non-host devices
  hosts: all
  gather_facts: no
  strategy: free               # parallel tasks
  vars:
    controller_dest_dir: "controllerConfigs"
    reservation_id: ""
    type: "configs"        # possibili valori: "configs" o "snapshot"
    name: ""               # usato solo se type == "snapshot"
    containerlab_test: false
    ansible_ssh_common_args: >-
      {{ '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' if containerlab_test else omit }}
    frr_conf_path: >-
      {{ '/etc/frr/frr.conf' if containerlab_test else '/etc/sonic/frr/frr.conf' }}

  pre_tasks:
    - name: Compute destination base directory according to type
      set_fact:
        base_dest_dir: "{{ lookup('template', playbook_dir + '/templates/base_dest.j2') | trim }}"

  tasks:
    - name: Fetch sonic config_db.json from devices that are not role 'host'
      ansible.builtin.fetch:
        src: /etc/sonic/config_db.json
        dest: "{{ base_dest_dir }}/{{ inventory_hostname }}_config_db.json"
        flat: yes
      when: hostvars[inventory_hostname].get('role', '') != 'host'
      ignore_errors: yes

    - name: Fetch frr.conf from devices that are not role 'host'
      ansible.builtin.fetch:
        src: "{{ frr_conf_path }}"
        dest: "{{ base_dest_dir }}/{{ inventory_hostname }}_frr.conf"
        flat: yes
      when: hostvars[inventory_hostname].get('role', '') != 'host'
      ignore_errors: yes
