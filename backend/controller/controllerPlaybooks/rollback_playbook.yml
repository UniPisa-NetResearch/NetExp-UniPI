---
- name: Apply config_db.json and frr.conf from snapshot, reload and verify system health (rollback)
  hosts: all
  gather_facts: false
  become: true
  strategy: free               # parallel tasks
  vars:
    # max number of try to check system status (es. 12 * 5s = 60s)
    max_retries: 12
    delay_seconds: 5
    containerlab_test: false
    ansible_ssh_common_args: >-
      {{ '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' if containerlab_test else omit }}
    frr_conf_path: >-
      {{ '/etc/frr/frr.conf' if containerlab_test else '/etc/sonic/frr/frr.conf' }}

  pre_tasks:
    - name: Ensure this playbook is invoked for rollback
      assert:
        that:
          - type is defined
          - type in ['rollback','configs']
        fail_msg: "Extra var 'type' is required and must be 'rollback' or 'configs'"

    - name: When type == configs require 'user_configs_folder' extra var
      assert:
        that:
          - "(type != 'configs') or (user_configs_folder is defined and user_configs_folder | length > 0)"
        fail_msg: "When type == 'configs' you must pass extra_var user_configs_folder=<folder_name>"

    - name: Ensure reservation_id and name are provided
      when: type == 'rollback'
      assert:
        that:
          - reservation_id is defined
          - name is defined
        fail_msg: "reservation_id and name extra_vars are required for type = 'rollback'"

    - name: Compute source base dir according to type (rendered on controller)
      set_fact:
        src_base_dir: >-
          {%- if type == 'rollback' -%}
          {{ playbook_dir }}/../snapshots/res_{{ reservation_id }}_snapshots/{{ name }}
          {%- elif user_configs_folder.startswith('/') -%}
          {{ user_configs_folder }}
          {%- else -%}
          {{ playbook_dir }}/../userConfigs/{{ user_configs_folder }}
          {%- endif -%}

  tasks:
    - name: Check if per-host config_db exists on controller (type=configs)
      when:
        - type == 'configs'
        - hostvars[inventory_hostname].get('role', '') != 'host'
      delegate_to: localhost
      become: false
      run_once: false
      stat:
        path: "{{ src_base_dir }}/{{ inventory_hostname }}_config_db.json"
      register: cfgdb_stat

    - name: Check if per-host frr.conf exists on controller (type=configs)
      when:
        - type == 'configs'
        - hostvars[inventory_hostname].get('role', '') != 'host'
      delegate_to: localhost
      become: false
      run_once: false
      stat:
        path: "{{ src_base_dir }}/{{ inventory_hostname }}_frr.conf"
      register: frr_stat

    - name: Decide if this host must be configured (type=configs)
      when:
        - hostvars[inventory_hostname].get('role', '') != 'host'
      set_fact:
        must_configure: >-
          {% if type == 'rollback' %}
          true
          {% else %}
          {{ (cfgdb_stat.stat.exists | default(false)) or
             (frr_stat.stat.exists | default(false)) }}
          {% endif %}

    - name: Cleanup previous temp configs (only non-host devices)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/new_config.json
        - /tmp/new_frr.conf
      when:
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure

    - name: Copy config file from snapshot on controller to /tmp/new_config.json (only non-host devices)
      copy:
        src: "{{ src_base_dir }}/{{ inventory_hostname }}_config_db.json"
        dest: "/tmp/new_config.json"
        owner: root
        group: root
        mode: '0644'
      when:
        - not containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure
        - (type == 'rollback' or cfgdb_stat.stat.exists | default(false))

    - name: Copy frr.conf from snapshot on controller to /tmp/new_frr.conf (only non-host devices)
      copy:
        src: "{{ src_base_dir }}/{{ inventory_hostname }}_frr.conf"
        dest: "/tmp/new_frr.conf"
        owner: root
        group: root
        mode: '0644'
      when:
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure
        - (type == 'rollback' or frr_stat.stat.exists | default(false))

    - name: Move new files into place (config + frr) and sync (only non-host devices)
      shell: |
        set -e
        moved=0
        if [ -f /tmp/new_config.json ]; then
          cp /tmp/new_config.json /etc/sonic/config_db.json
          moved=1
        fi
        if [ -f /tmp/new_frr.conf ]; then
          cp /tmp/new_frr.conf {{ frr_conf_path }}
          moved=1
        fi
        sync
        echo "moved=${moved}"
      register: cp_result_physical
      failed_when: cp_result_physical.rc != 0
      when:
        - not containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure

    - name: Reload SONiC config (only non-host devices)
      shell: config reload -y
      register: reload_result
      failed_when: reload_result.rc != 0
      when:
        - not containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure
        - cp_result_physical.stdout is defined and 'moved=1' in cp_result_physical.stdout

    - name: Check system health with retries until all services OK (excluding rsync)
      shell: |
        show system-health sysready-status | awk '
          BEGIN { c=0 }
          /^-+/ { next }                  # skip separator lines
          /^Service-Name/ { next }        # skip header line
          NF < 2 { next }                 # skip short lines
          {
            name=$1; status=$2;
            if (status !~ /^(OK|Down|Starting|Inactive|Failed|Stopped|Unknown|Starting)$/) next;
            n=tolower(name);
            if (n == "rsync") next;
            if (status != "OK") { c++ }
          }
          END { print c } '
      register: non_ok_count
      changed_when: false
      retries: "{{ max_retries }}"
      delay: "{{ delay_seconds }}"
      until: (non_ok_count.stdout | default('0') | int) == 0
      when:
        - not containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure
        - cp_result_physical.stdout is defined and 'moved=1' in cp_result_physical.stdout

    - name: Capture full system-health output for diagnostics
      shell: show system-health sysready-status
      register: sysready_full
      changed_when: false
      when:
        - not containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure
        - cp_result_physical.stdout is defined and 'moved=1' in cp_result_physical.stdout

    - name: Fail if after retries there are still non-OK services (excluding rsync)
      fail:
        msg: >-
          Services not OK after {{ max_retries }} attempts on host {{ inventory_hostname }}.
          Non-OK services count: {{ non_ok_count.stdout | default('0') }}.
          Full sysready output:
          {{ sysready_full.stdout }}
      when:
        - not containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure
        - cp_result_physical.stdout is defined and 'moved=1' in cp_result_physical.stdout
        - (non_ok_count.stdout | default('0') | int) > 0

    - name: Move only frr.conf into place (containerlab)
      shell: |
        set -e
        moved=0
        if [ -f /tmp/new_frr.conf ]; then
          cp /tmp/new_frr.conf {{ frr_conf_path }}
          sync
          moved=1
        fi
        echo "moved=${moved}"
      register: cp_result_containerlab
      failed_when: cp_result_containerlab.rc != 0
      when:
        - containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure

    - name: Restart FRR on containerlab nodes after restoring frr.conf
      shell: |
        set -e
        service frr restart
        sleep 5
      register: reload_result
      failed_when: reload_result.rc != 0
      when:
        - containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure
        - cp_result_containerlab.stdout is defined and 'moved=1' in cp_result_containerlab.stdout

    - name: Verify FRR is running after restart
      shell: service frr status
      register: frr_status
      retries: 5
      delay: 2
      until: >
        ('Status of watchfrr: running.' in frr_status.stdout) and
        ('Status of zebra: running.' in frr_status.stdout) and
        ('Status of mgmtd: running.' in frr_status.stdout) and
        ('Status of bgpd: running.' in frr_status.stdout) and
        ('Status of staticd: running.' in frr_status.stdout)
      changed_when: false
      when:
        - containerlab_test
        - hostvars[inventory_hostname].get('role', '') != 'host'
        - must_configure
        - cp_result_containerlab.stdout is defined and 'moved=1' in cp_result_containerlab.stdout