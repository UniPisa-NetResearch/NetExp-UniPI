- name: Grant SSH access to reservation users (no package installs)
  hosts: all
  gather_facts: no
  become: yes
  strategy: free               # parallel tasks
  vars:
    test: false                # if false the management interfaces are the real one, otherwise are eth1 and enp1s0
    res_group: resusers        # group used to collect reservation users
    full_user: false           # if true, user does not have restricted access by wrappers (false default)
    # candidate commands we want to expose to reservation users
    candidate_cmds:
      - ip
      - ping
      - traceroute
      - tc
      - config
      - vtysh
      - iperf3
      - netperf
      - nping
      - scapy
      - tcpreplay
      - tcpdump
      - tshark

  tasks:
    # set is_sonic if the device is SONiC switch or minipc Qotom and set the correct interface
    - name: Set device type facts and default management interface from inventory role
      ansible.builtin.set_fact:
        is_sonic: "{{ hostvars[inventory_hostname].get('role', '') != 'host' }}"
        mgmt_iface: >-
          {{
            (
              ( 'eth1' if (hostvars[inventory_hostname].get('role', '') != 'host') else 'enp1s0' )
            )
            if ( test | default(False) | bool )
            else
            (
              hostvars[inventory_hostname].get('res_iface')
              if ( hostvars[inventory_hostname].get('res_iface') is defined and hostvars[inventory_hostname].get('res_iface') not in [None, ''] )
              else ( 'eth0' if (hostvars[inventory_hostname].get('role', '') != 'host') else 'enp2s0' )
            )
          }}

    # write detected mgmt iface to a file used by wrapper scripts
    - name: Ensure /etc/res_mgmt_iface contains the management interface name
      ansible.builtin.copy:
        dest: /etc/res_mgmt_iface
        content: "{{ mgmt_iface }}\n"
        owner: root
        group: root
        mode: '0644'

    # install all the wrappers on the devices
    - block:
      - name: Deploy res_ip wrapper (always)
        ansible.builtin.copy:
          src: "wrappers/res_ip.sh"
          dest: /usr/local/sbin/res_ip
          owner: root
          group: root
          mode: '0755'

      - name: Deploy res_tc wrapper (always)
        ansible.builtin.copy:
          src: "wrappers/res_tc.sh"
          dest: /usr/local/sbin/res_tc
          owner: root
          group: root
          mode: '0755'

      - name: Deploy res_vtysh wrapper (only on SONiC)
        ansible.builtin.copy:
          src: "wrappers/res_vtysh.sh"
          dest: /usr/local/sbin/res_vtysh
          owner: root
          group: root
          mode: '0755'
        when: is_sonic

      - name: Deploy res_config wrapper (only on SONiC)
        ansible.builtin.copy:
          src: "wrappers/res_config.sh"
          dest: /usr/local/sbin/res_config
          owner: root
          group: root
          mode: '0755'
        when: is_sonic

      when: not full_user | bool
    # verify which wrappers exist on the target, used to build a convenience map
    - name: Set wrapper existence based on deployment
      ansible.builtin.set_fact:
        wrapper_exists:
          res_ip: true
          res_tc: true
          res_vtysh: "{{ is_sonic }}"
          res_config: "{{ is_sonic }}"
      when: not full_user | bool

    # ensure the group exists for later user creation
    - name: Create group for reservation users
      ansible.builtin.group:
        name: "{{ res_group }}"
        state: present

    - name: Ensure clean state - remove existing user and sudoers if present
      block:
        - name: Remove existing user
          ansible.builtin.user:
            name: "{{ username }}"
            state: absent
            remove: yes
            force: yes
          ignore_errors: yes

        - name: Remove existing sudoers file
          ansible.builtin.file:
            path: "/etc/sudoers.d/{{ username }}"
            state: absent
          ignore_errors: yes

        - name: Remove existing SSH Match block
          ansible.builtin.lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^Match User {{ username }}$"
            state: absent
          ignore_errors: yes

    # create the reservation user, it cannot log in with password (ssh key only)
    - name: Create user account {{ username }}
      ansible.builtin.user:
        name: "{{ username }}"
        state: present
        create_home: yes
        home: "/home/{{ username }}"
        shell: /bin/bash
        password_lock: yes
        system: no
        groups: "{{ res_group }}"
        append: yes
    # ------------------------------------------------------------------
    - name: Check if this device is the NAS itself (skip mount if true)
      ansible.builtin.set_fact:
        is_nas_device: "{{ ansible_host == nas_ip }}"
      when: nas_ip is defined

    - name: NFS mount operations (skip if device is NAS)
      block:
        - name: Check if nfs-common is installed
          ansible.builtin.package_facts:
            manager: apt
          when: ansible_facts.packages is not defined

        - name: Install NFS client packages if not installed
          ansible.builtin.apt:
            name:
              - nfs-common
            state: present
            update_cache: no
          when: "'nfs-common' not in ansible_facts.packages"

        - name: Create device-specific mount point using asset_tag
          ansible.builtin.file:
            path: "{{ nas_mount_base }}/{{ hostvars[inventory_hostname].get('asset_tag', inventory_hostname) }}"
            state: directory
            owner: root
            group: "{{ res_group }}"
            mode: '2775'

        - name: Check if NFS share is already mounted
          ansible.builtin.shell: |
            mountpoint -q "{{ nas_mount_base }}/{{ hostvars[inventory_hostname].get('asset_tag', inventory_hostname) }}"
          register: nfs_already_mounted
          failed_when: false
          changed_when: false

        - name: Mount NFS share from NAS (skips if already mounted)
          ansible.posix.mount:
            path: "{{ nas_mount_base }}/{{ hostvars[inventory_hostname].get('asset_tag', inventory_hostname) }}"
            src: "{{ nas_ip }}:/export/{{ hostvars[inventory_hostname].get('asset_tag', inventory_hostname) }}"
            fstype: nfs
            opts: "{{ nfs_opts }}"
            state: mounted
            backup: no
          when: nfs_already_mounted.rc != 0

      when:
        - nas_ip is defined
        - is_nas_device is defined
        - not is_nas_device | bool
    # ------------------------------------------------------------------
    # detect real paths for candidate commands using `command -v`, create a script that perform the command for each value of the list with one ssh connection
    - name: Detect all candidate commands at once
      ansible.builtin.shell: |
        for cmd in {{ candidate_cmds | join(' ') }}; do
          path=$(command -v $cmd 2>/dev/null || true)
          if [ -n "$path" ]; then
            echo "${cmd} ${path}"
          fi
        done
      register: which_all
      changed_when: false
      check_mode: no

    # create a dictionary mapping, example result: { "ip": "/usr/bin/ip", "tc": "/sbin/tc", ... }
    # only for non-empty output
    - name: Build mapping command -> path from single output
      ansible.builtin.set_fact:
        found_cmd_paths: "{{ found_cmd_paths | default({}) | combine({item.split()[0]: item.split()[1]}) }}"
      loop: "{{ which_all.stdout_lines }}"
      when: item | trim != ''

    # install missing candidate commands via apt (skip config and vtysh, already installed on SONiC and not necessary on minipc)
    # create list of missing commands
    - name: Build list of missing candidate commands (exclude vtysh and config)
      ansible.builtin.set_fact:
        missing_cmds: >-
          {{
            (candidate_cmds | difference( (found_cmd_paths | default({})).keys() | list ))
            | difference(['vtysh','config'])
          }}

    # try apt update, ignore_errors preserves flow even if update_cache fails
    - name: Run apt update only if cache is old (ignore failure of update_cache)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 86400  # 24 hours in seconds
      ignore_errors: yes

    # map command : apt package
    - name: Define mapping command -> apt package name
      ansible.builtin.set_fact:
        pkg_map:
          ip: iproute2
          ping: iputils-ping
          traceroute: traceroute
          tc: iproute2
          iperf3: iperf3
          netperf: netperf
          nping: nmap
          scapy: python3-scapy
          tcpreplay: tcpreplay
          tcpdump: tcpdump
          tshark: tshark

    - name: Create list of packages to install
      ansible.builtin.set_fact:
        pkgs_to_install: "{{ missing_cmds | intersect(pkg_map.keys() | list) |  map('extract', pkg_map) | list}}"

    # install missing packages
    - name: Install packages for missing commands (batch)
      ansible.builtin.apt:
        name: "{{ pkgs_to_install }}"
        state: present
      when: pkgs_to_install | length > 0
      ignore_errors: yes
      async: 300  # timeout of 5 minutes (for slow tasks)
      poll: 0     # don't wait completion
      register: apt_install_async

    # wait for async task completion
    - name: Wait for package installation to complete
      async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ apt_install_async.results }}"
      when: apt_install_async is defined and item.ansible_job_id is defined
      register: apt_install_result
      until: apt_install_result.finished
      retries: 60
      delay: 5

    # override commands to use wrappers if installed
    - name: Conditionally override found_cmd_paths for commands that must use wrappers
      ansible.builtin.set_fact:
        found_cmd_paths_overridden: >-
          {{
            found_cmd_paths
            | combine(
                ( {'ip': '/usr/local/sbin/res_ip'} if (wrapper_exists.res_ip and (found_cmd_paths.get('ip','') != '')) else {} )
              )
            | combine(
                ( {'tc': '/usr/local/sbin/res_tc'} if (wrapper_exists.res_tc and (found_cmd_paths.get('tc','') != '')) else {} )
              )
            | combine(
                ( {'vtysh': '/usr/local/sbin/res_vtysh'} if (is_sonic and wrapper_exists.res_vtysh and (found_cmd_paths.get('vtysh','') != '')) else {} )
              )
            | combine(
                ( {'config': '/usr/local/sbin/res_config'} if (is_sonic and wrapper_exists.res_config and (found_cmd_paths.get('config','') != '')) else {} )
              )
          }}
      when: not full_user | bool

    - name: Skip overrides when full_user and keep original found_cmd_paths
      ansible.builtin.set_fact:
        found_cmd_paths_overridden: "{{ found_cmd_paths | default({}) }}"
      when: full_user | bool

    # collect absolute paths (values of the mapping) into a list for sudoers
    - name: Build allowed_bins list from found command paths (absolute paths)
      ansible.builtin.set_fact:
        allowed_bins: >-
          {{
            (found_cmd_paths_overridden | default(found_cmd_paths)).values() | select('!=', '') | list
          }}

    # compose categorized command lists for sudoers (RES_NET, RES_CONFIG, RES_TEST)
    - name: Compose sudo alias lists (RES_NET, RES_CONFIG, RES_TEST)
      ansible.builtin.set_fact:
        res_net_cmds: "{{ allowed_bins | select('search','/usr/local/sbin/res_ip$|/bin/ip$|/sbin/ip$|/usr/bin/ip$|/usr/sbin/ip$|/bin/ping$|/usr/bin/ping$|/usr/bin/traceroute$|/sbin/traceroute$|/usr/sbin/tc$|/sbin/tc$|/usr/local/sbin/res_tc$') | list }}"
        res_config_cmds: "{{ allowed_bins | select('search','/usr/local/sbin/res_config$|/usr/bin/config$|config$|/usr/local/sbin/res_vtysh$|vtysh$') | list }}"
        res_test_cmds: "{{ allowed_bins | select('search','iperf3$|netperf$|nping$|scapy$|tcpreplay$|tcpdump$|tshark$') | list }}"

    # deploy sudoers file (using a template) with only the present absolute paths
    - name: Install limited sudoers for reservation user (only for present commands)
      ansible.builtin.template:
        src: sudoers_res.j2
        dest: "/etc/sudoers.d/{{ username }}"
        owner: root
        group: root
        mode: '0440'
      notify: validate sudoers

    # ssh key assignment is the last operation to avoid user access while device is not ready
    # create .ssh directory for the user
    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ username }}/.ssh"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0700'
    # add user public key to authorized_keys
    - name: Add public key to authorized_keys
      ansible.builtin.authorized_key:
        user: "{{ username }}"
        key: "{{ ssh_key }}"
        state: present
        path: "/home/{{ username }}/.ssh/authorized_keys"

    # ensure authorized_keys is readable only by the user
    - name: Ensure authorized_keys has correct permissions
      ansible.builtin.file:
        path: "/home/{{ username }}/.ssh/authorized_keys"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0600'

    # adds a Match block so user cannot authenticate with a password
    - name: Add per user SSHd Match block to disable password auth for this user
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE-RES-{{ username }}"
        block: |
          Match User {{ username }}
              PasswordAuthentication no
      notify: restart sshd

  handlers:
    # validate the generated sudoers fragment to avoid locking out sudo
    - name: validate sudoers
      ansible.builtin.command:
        cmd: visudo -cf /etc/sudoers.d/{{ username }}
      register: visudo_check
      failed_when: visudo_check.rc != 0

    # attempt a safe restart of the SSH
    - name: restart sshd
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl restart sshd || systemctl restart ssh || true
        else
          service ssh restart || service sshd restart || true
        fi
      become: yes
      changed_when: false