---
- name: Collect data plane IPs
  hosts: all
  gather_facts: no
  vars:
    containerlab_test: false
    ansible_ssh_common_args: >-
      {{ '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' if containerlab_test else omit }}

  tasks:
    - name: Get non-management IPs
      ansible.builtin.shell: |
        ip -4 -o addr show | \
        grep -v ' lo ' | \
        grep -v " {{ res_iface | default('lo') }} " | \
        grep -v " inet {{ ansible_host }}/" | \
        awk '{split($4, a, "/"); print a[1]}' | \
        sort -u
      register: ip_output
      changed_when: false
      when: inventory_hostname != 'localhost'

    - name: Store IPs as fact
      set_fact:
        data_plane_ips: "{{ ip_output.stdout_lines | reject('equalto', '') | list }}"
      when: inventory_hostname != 'localhost'

- name: Execute pingall tests with early exit
  hosts: all
  gather_facts: no
  vars:
    ping_count: 1
    ping_timeout: 1
    containerlab_test: false
    ansible_ssh_common_args: >-
      {{ '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' if containerlab_test else omit }}

  tasks:
    - name: Ping destination IPs until first success
      ansible.builtin.shell: |
        {% set dst_ips = hostvars[item].get('data_plane_ips', []) %}
        {% if dst_ips | length > 0 %}
        SUCCESS=0
        TESTED_IPS=""
        REACHABLE_IP=""
        {% for ip in dst_ips %}
        TESTED_IPS="${TESTED_IPS}{{ ip }} "
        if ping -c {{ ping_count }} -W {{ ping_timeout }} {{ ip }} > /dev/null 2>&1; then
          SUCCESS=1
          REACHABLE_IP="{{ ip }}"
          break
        fi
        {% endfor %}
        echo "success=$SUCCESS|reachable_ip=$REACHABLE_IP|tested_ips=$TESTED_IPS"
        exit $((1 - SUCCESS))
        {% else %}
        echo "success=-1|reachable_ip=|tested_ips="
        exit 2
        {% endif %}
      loop: "{{ groups['all'] | difference(['localhost', inventory_hostname]) }}"
      register: connectivity_tests
      ignore_errors: true
      changed_when: false
      when:
        - inventory_hostname != 'localhost'
        - data_plane_ips | default([]) | length > 0

    # MODIFICA: Usa regex invece di split()
    - name: Parse connectivity results
      set_fact:
        host_results: >-
          {%- set results = [] -%}
          {%- if inventory_hostname != 'localhost' -%}
            {%- if data_plane_ips | default([]) | length == 0 -%}
              {# Source non ha IP #}
              {%- for dst in groups['all'] | difference(['localhost', inventory_hostname]) -%}
                {%- set _ = results.append({
                  'src': inventory_hostname,
                  'dst': dst,
                  'status': 'no_source_ip',
                  'output': 'Source has no data plane IP'
                }) -%}
              {%- endfor -%}
            {%- elif connectivity_tests is defined and connectivity_tests.results is defined -%}
              {# Processa risultati ping usando regex #}
              {%- for test in connectivity_tests.results -%}
                {%- set stdout = test.stdout | default('') -%}
                {%- set success_match = stdout | regex_search('success=(-?\\d+)') -%}
                {%- set ip_match = stdout | regex_search('reachable_ip=([^ |]*)') -%}
                {%- set tested_match = stdout | regex_search('tested_ips=(.*)') -%}
                {%- set success = success_match | regex_replace('success=', '') | int if success_match else -1 -%}
                {%- set reachable_ip = ip_match | regex_replace('reachable_ip=', '') if ip_match else '' -%}
                {%- set tested_ips = tested_match | regex_replace('tested_ips=', '') | trim if tested_match else '' -%}
                {%- if success == 1 -%}
                  {%- set _ = results.append({
                    'src': inventory_hostname,
                    'dst': test.item,
                    'status': 'reachable',
                    'output': 'Host reachable at ' + reachable_ip
                  }) -%}
                {%- elif success == 0 -%}
                  {%- set _ = results.append({
                    'src': inventory_hostname,
                    'dst': test.item,
                    'status': 'unreachable',
                    'output': 'Host unreachable. Tested IPs: ' + tested_ips
                  }) -%}
                {%- else -%}
                  {%- set _ = results.append({
                    'src': inventory_hostname,
                    'dst': test.item,
                    'status': 'no_dest_ip',
                    'output': 'Destination has no data plane IP'
                  }) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endif -%}
          {{ results }}

- name: Aggregate and save results
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Collect all results
      set_fact:
        all_results: >-
          {%- set results = [] -%}
          {%- for host in groups['all'] -%}
            {%- if host != 'localhost' and 'host_results' in hostvars[host] -%}
              {%- set _ = results.extend(hostvars[host]['host_results']) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ results }}

    - name: Calculate summary by status
      set_fact:
        summary:
          reachable: "{{ all_results | selectattr('status', 'equalto', 'reachable') | list | length }}"
          unreachable: "{{ all_results | selectattr('status', 'equalto', 'unreachable') | list | length }}"
          no_source_ip: "{{ all_results | selectattr('status', 'equalto', 'no_source_ip') | list | length }}"
          no_dest_ip: "{{ all_results | selectattr('status', 'equalto', 'no_dest_ip') | list | length }}"
          total: "{{ all_results | length }}"

    - name: Save results
      ansible.builtin.copy:
        content: |
          {{ {'summary': summary, 'results': all_results, 'message': 'Pingall test completed'} | to_nice_json }}
        dest: "{{ results_file }}"