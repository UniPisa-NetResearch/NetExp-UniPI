- name: Grant SSH access to reservation users (no package installs)
  hosts: all
  gather_facts: yes
  become: yes
  vars:
    res_group: resusers
    candidate_cmds:
      - ip
      - ping
      - traceroute
      - tc
      - vtysh
      - iperf3
      - netperf
      - nping
      - scapy
      - tcpreplay
      - tcpdump
      - tshark

  tasks:
    - name: Create group for reservation users
      ansible.builtin.group:
        name: "{{ res_group }}"
        state: present

    - name: Create user account {{ username }}
      ansible.builtin.user:
        name: "{{ username }}"
        state: present
        create_home: yes
        home: "/home/{{ username }}"
        shell: /bin/bash
        password_lock: yes
        system: no
        groups: "{{ res_group }}"
        append: yes

    # Detect real paths for candidate commands using `command -v`
    - name: Run command -v for each candidate command (detection only)
      ansible.builtin.shell: "command -v {{ item }} || true"
      loop: "{{ candidate_cmds }}"
      register: which_results
      changed_when: false
      check_mode: no

    - name: Build mapping command -> path (only found entries)
      ansible.builtin.set_fact:
        found_cmd_paths: >-
          {{
            dict(
              candidate_cmds
              | zip(which_results.results | map(attribute='stdout'))
              | selectattr('1','!=','')
              | list
            )
          }}

    - name: show found command paths
      ansible.builtin.debug:
        msg:
          found_cmd_paths: "{{ found_cmd_paths }}"

    - name: Build allowed_bins list from found command paths (absolute paths)
      ansible.builtin.set_fact:
        allowed_bins: "{{ found_cmd_paths.values() | select('!=', '') | list }}"

    - name: final allowed binaries (absolute paths)
      ansible.builtin.debug:
        var: allowed_bins

    # Compose categorized command lists for sudoers (RES_NET, RES_CONFIG, RES_TEST)
    - name: Compose sudo alias lists (RES_NET, RES_CONFIG, RES_TEST)
      ansible.builtin.set_fact:
        res_net_cmds: "{{ allowed_bins | select('search','/bin/ip$|/sbin/ip$|/usr/bin/ip$|/usr/sbin/ip$|/bin/ping$|/usr/bin/ping$|/usr/bin/traceroute$|/sbin/traceroute$|/usr/sbin/tc$|/sbin/tc$') | list }}"
        res_config_cmds: "{{ allowed_bins | select('search','vtysh$') | list }}"
        res_test_cmds: "{{ allowed_bins | select('search','iperf3$|netperf$|nping$|scapy$|tcpreplay$|tcpdump$|tshark$') | list }}"

    - name: show categorized command groups for sudoers
      ansible.builtin.debug:
        msg:
          res_net_cmds: "{{ res_net_cmds }}"
          res_config_cmds: "{{ res_config_cmds }}"
          res_test_cmds: "{{ res_test_cmds }}"

    # Deploy sudoers file with only the present absolute paths
    - name: Install limited sudoers for reservation user (only for present commands)
      ansible.builtin.template:
        src: sudoers_res.j2
        dest: "/etc/sudoers.d/{{ username }}"
        owner: root
        group: root
        mode: '0440'
      notify: validate sudoers
      # ssh key assignment is the last operation to avoid user access while device is not ready
    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ username }}/.ssh"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0700'

    - name: Add public key to authorized_keys
      ansible.builtin.authorized_key:
        user: "{{ username }}"
        key: "{{ ssh_key }}"
        state: present
        path: "/home/{{ username }}/.ssh/authorized_keys"

    - name: Ensure authorized_keys has correct permissions
      ansible.builtin.file:
        path: "/home/{{ username }}/.ssh/authorized_keys"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0600'

    - name: Add per user SSHd Match block to disable password auth for this user
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE-RES-{{ username }}"
        block: |
          Match User {{ username }}
              PasswordAuthentication no
      notify: restart sshd

  handlers:
    - name: validate sudoers
      ansible.builtin.command:
        cmd: visudo -cf /etc/sudoers.d/{{ username }}
      register: visudo_check
      failed_when: visudo_check.rc != 0

    - name: restart sshd
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl restart sshd || systemctl restart ssh || true
        else
          service ssh restart || service sshd restart || true
        fi
      become: yes
      changed_when: false
